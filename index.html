<html lang="ja">

<body>

        <div class="login-container">

                <label for="username">ユーザーネーム:</label>

                <label for="pass">パスワード:</label>

                <input type="submit" value="ログイン">
                <a href="userreg.html">[新規登録]</a>
            </form>
        </div>
    </div>
